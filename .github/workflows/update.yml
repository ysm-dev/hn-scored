name: update

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bin
          gh release download latest --pattern "hn-scored-x86_64-unknown-linux-gnu" --dir ./bin
          chmod +x ./bin/hn-scored-x86_64-unknown-linux-gnu

      - name: Restore runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ./.state

          if ! gh release view state >/dev/null 2>&1; then
            gh release create state \
              --title "Runtime state" \
              --notes "Rolling runtime state for the update workflow."
          fi

          release_id=$(gh release view state --json databaseId --jq .databaseId)
          asset_name=$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | \
            jq -r 'add | [.[] | select(.name == "state.json" or (.name | startswith("state-")))] | sort_by(.created_at, .id) | last | .name // empty')

          if [ -n "$asset_name" ]; then
            gh release download state --pattern "$asset_name" --dir ./.state
            mv "./.state/$asset_name" ./state.json
          elif [ ! -f ./state.json ]; then
            echo "::warning::No runtime state snapshot exists; rebuilding from empty state"
          fi

      - run: npm install -g wrangler@4

      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          interval=60
          max_runtime=720
          start_epoch=$(date +%s)
          deadline=$((start_epoch + max_runtime))
          next_tick=$start_epoch
          iteration=0
          successor_queued=false

          publish_state() {
            snapshot="state-${GITHUB_RUN_ID}-${iteration}.json"
            cp ./state.json "./.state/$snapshot"
            gh release upload state "./.state/$snapshot"

            release_id=$(gh release view state --json databaseId --jq .databaseId)
            if ! stale_asset_ids=$(gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" | \
              jq -r 'add | [.[] | select(.name == "state.json" or (.name | startswith("state-")))] | sort_by(.created_at, .id) | reverse | .[2:][] | .id'); then
              echo "state snapshot cleanup listing failed"
              return 0
            fi

            while IFS= read -r asset_id; do
              if [ -n "$asset_id" ] && ! gh api \
                --method DELETE \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null; then
                echo "state snapshot cleanup failed for asset $asset_id"
              fi
            done <<< "$stale_asset_ids"
          }

          queue_successor() {
            if [ "$successor_queued" = true ]; then
              return 0
            fi

            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
              -f ref="${GITHUB_REF_NAME}" >/dev/null; then
              successor_queued=true
              echo "queued successor run"
            else
              echo "dispatch retry failed"
            fi
          }

          queue_successor

          while :; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              break
            fi

            if [ "$now" -lt "$next_tick" ]; then
              sleep $((next_tick - now))
            fi

            iter_start=$(date +%s)
            if [ "$iter_start" -ge "$deadline" ]; then
              break
            fi

            iteration=$((iteration + 1))
            lag=$((iter_start - next_tick))
            if [ "$lag" -lt 0 ]; then
              lag=0
            fi

            echo "--- iteration $iteration (elapsed=$((iter_start - start_epoch))s lag=${lag}s queued=${successor_queued}) ---"

            queue_successor

            set +e
            ./bin/hn-scored-x86_64-unknown-linux-gnu --state ./state.json --output ./dist
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              publish_state
              if ! wrangler deploy; then
                echo "deploy failed"
              fi
            elif [ "$code" -eq 1 ]; then
              echo "fatal cycle error"
            elif [ "$code" -ne 2 ]; then
              echo "unexpected exit code: $code"
            fi

            next_tick=$((next_tick + interval))
          done
