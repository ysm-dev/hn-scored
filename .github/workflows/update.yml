name: update

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bin
          gh release download latest --pattern "hn-scored-x86_64-unknown-linux-gnu" --dir ./bin
          chmod +x ./bin/hn-scored-x86_64-unknown-linux-gnu

      - name: Restore runtime state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view state >/dev/null 2>&1; then
            mkdir -p ./.state
            gh release download state --pattern "state.json" --dir ./.state
            mv ./.state/state.json ./state.json
          elif [ -f ./state.json ]; then
            gh release create state ./state.json \
              --title "Runtime state" \
              --notes "Rolling runtime state for the update workflow."
          else
            echo "state release and bootstrap state.json are missing" >&2
            exit 1
          fi

      - run: npm install -g wrangler@4

      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          interval=60
          max_runtime=720
          start_epoch=$(date +%s)
          deadline=$((start_epoch + max_runtime))
          next_tick=$start_epoch
          iteration=0
          successor_queued=false

          queue_successor() {
            if [ "$successor_queued" = true ]; then
              return 0
            fi

            if gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
              -f ref="${GITHUB_REF_NAME}" >/dev/null; then
              successor_queued=true
              echo "queued successor run"
            else
              echo "dispatch retry failed"
            fi
          }

          queue_successor

          while :; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              break
            fi

            if [ "$now" -lt "$next_tick" ]; then
              sleep $((next_tick - now))
            fi

            iter_start=$(date +%s)
            if [ "$iter_start" -ge "$deadline" ]; then
              break
            fi

            iteration=$((iteration + 1))
            lag=$((iter_start - next_tick))
            if [ "$lag" -lt 0 ]; then
              lag=0
            fi

            echo "--- iteration $iteration (elapsed=$((iter_start - start_epoch))s lag=${lag}s queued=${successor_queued}) ---"

            queue_successor

            set +e
            ./bin/hn-scored-x86_64-unknown-linux-gnu --state ./state.json --output ./dist
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              gh release upload state ./state.json --clobber
              if ! wrangler deploy; then
                echo "deploy failed"
              fi
            elif [ "$code" -eq 1 ]; then
              echo "fatal cycle error"
            elif [ "$code" -ne 2 ]; then
              echo "unexpected exit code: $code"
            fi

            next_tick=$((next_tick + interval))
          done
